name: End-to-End Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: part14/blogapp-nextjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: part14/blogapp-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env.local
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.local
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env.local
          echo "NEXTAUTH_URL=http://127.0.0.1:3000" >> .env.local
          echo "NODE_ENV=test" >> .env.local

      - name: Verify environment setup
        run: |
          echo "Checking .env.local file:"
          cat .env.local | sed 's/=.*/=***/'

      - name: Run database migrations
        run: npx drizzle-kit push --force

      - name: Build app
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: part14/blogapp-nextjs/playwright-report/
          retention-days: 30
